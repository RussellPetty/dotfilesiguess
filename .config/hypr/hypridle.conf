general {
    lock_cmd = hyprlock                                    # lock screen (keeping for manual lock)
    #before_sleep_cmd = loginctl lock-session              # DISABLED - no lock before suspend
    after_sleep_cmd = sleep 1 && hyprctl dispatch dpms on  # to avoid having to press a key twice to turn on the display.
    #inhibit_sleep = 3                                     # DISABLED - don't wait for lock
}

# AUTO-LOCK DISABLED - Screen won't lock automatically
#listener {
#    timeout = 180                                             # 3min
#    on-timeout = loginctl lock-session                        # lock screen when timeout has passed
#}

listener {
    timeout = 210                                            # 3.5min
    on-timeout = hyprctl dispatch dpms off                   # screen off when timeout has passed
    on-resume = hyprctl dispatch dpms on && brightnessctl -r # screen on when activity is detected
}
